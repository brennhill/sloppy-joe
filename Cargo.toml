[package]
name = "sloppy-joe"
version = "2.0.0"
edition = "2024"
description = "Detect hallucinated, typosquatted, and non-canonical dependencies"
license = "Apache-2.0"
repository = "https://github.com/brennhill/sloppy-joe"
homepage = "https://github.com/brennhill/sloppy-joe"
readme = "README.md"
exclude = [".aviator/**"]
keywords = ["security", "dependencies", "typosquatting", "supply-chain", "ai"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Brenn Hill"]

[dependencies]
clap = { version = "=4.6.0", features = ["derive", "env"] }
reqwest = { version = "=0.12.27", features = ["rustls-tls", "json", "stream"], default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde_yaml = "=0.9.34"
json5 = "=0.4.0"
strsim = "=0.11.1"
tokio = { version = "=1.53.3", features = ["full"] }
anyhow = "=1.0.104"
colored = "=2.1.0"
futures = "=0.3.32"
toml = "=0.8.23"
async-trait = "=0.1.89"
libc = "=0.2.183"
sha1 = { version = "=0.10.6", default-features = false }
sha2 = "=0.10.9"
pep440_rs = "=0.7.3"
# npm tarball verification (manifest-confusion check). Pure-Rust gzip backend,
# no xattr support: tarballs are only read in memory, never extracted.
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
semver = "=1.0.28"

# Parses the sources in tests/architecture/syn_graph.rs: an independent check of layer direction.
[dev-dependencies]
syn = { version = "=2.0.117", features = ["full", "visit"] }
proc-macro2 = "=1.0.106"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
